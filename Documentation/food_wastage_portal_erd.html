<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `erDiagram
  USER ||--o{ DONATION : posts
  USER ||--o{ DONATION : moderates
  DONATION ||--o{ DONATION_ITEM : contains
  DONATION ||--o| CLAIM : claimed_by
  USER ||--o{ CLAIM : claims
  USER ||--o{ NOTIFICATION : receives
  DONATION ||--o{ NOTIFICATION : triggers
  DONATION ||--o| FEEDBACK : rated_by
  USER ||--o{ FEEDBACK : gives
  DONATION ||--o| VOLUNTEER_TASK : assigned_to
  USER ||--o{ VOLUNTEER_TASK : performs
  USER ||--o{ VERIFICATION_DOCUMENT : uploads
  USER ||--o{ VERIFICATION_DOCUMENT : reviews
  DONATION ||--o{ DISPUTE : involves
  CLAIM ||--o{ DISPUTE : involves
  USER ||--o{ DISPUTE : raises
  USER ||--o{ DISPUTE : resolves

  USER {
    int user_id PK
    string name
    string email UK
    string password
    string phone
    string org_name
    string address
    string city
    string role
    string verification_status
    boolean is_active
    timestamp created_at
  }
  DONATION {
    int donation_id PK
    int donor_id FK
    string pickup_address
    string city
    decimal latitude
    decimal longitude
    string status
    string admin_approval
    string rejection_reason
    int moderated_by FK
    timestamp created_at
  }
  DONATION_ITEM {
    int item_id PK
    int donation_id FK
    string item_name
    string category
    decimal quantity
    string unit
    timestamp best_before
    string photo
  }
  CLAIM {
    int claim_id PK
    int donation_id FK
    int receiver_id FK
    timestamp claim_date
    string pickup_status
    timestamp updated_at
  }
  NOTIFICATION {
    int notification_id PK
    int user_id FK
    int donation_id FK
    string message
    string type
    boolean is_read
    timestamp created_at
  }
  FEEDBACK {
    int feedback_id PK
    int donation_id FK
    int receiver_id FK
    int rating
    string comment
    timestamp created_at
  }
  VOLUNTEER_TASK {
    int task_id PK
    int donation_id FK
    int volunteer_id FK
    string task_status
    timestamp assigned_at
    timestamp completed_at
  }
  VERIFICATION_DOCUMENT {
    int document_id PK
    int user_id FK
    string file_path
    string status
    timestamp uploaded_at
    int reviewed_by FK
    timestamp reviewed_at
  }
  DISPUTE {
    int dispute_id PK
    int donation_id FK
    int claim_id FK
    int raised_by FK
    string description
    string admin_note
    string status
    int resolved_by FK
    timestamp created_at
    timestamp resolved_at
  }`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
